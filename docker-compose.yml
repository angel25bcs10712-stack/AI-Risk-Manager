version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: riskguard-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - riskguard-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Python FastAPI ML Risk Engine
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: riskguard-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - riskguard-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Node.js Express REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: riskguard-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/riskguard
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - riskguard-network

  # 4. React Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: riskguard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - riskguard-network

networks:
  riskguard-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
